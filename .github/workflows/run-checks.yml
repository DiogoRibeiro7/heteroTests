name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  project-quality:
    name: Style, lint, tests
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::styler
            any::lintr
            any::covr
            any::ggplot2
          needs: check
      - name: Run project checks
        run: Rscript scripts/run_checks.R
      - name: Upload coverage artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
      - name: Upload to codecov
        if: success() || failure()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          Rscript -e "if (!requireNamespace('covr', quietly = TRUE)) install.packages('covr')"
          Rscript -e "covr::codecov(token = Sys.getenv('CODECOV_TOKEN'))"

  docs-quality:
    name: Spell and link checks
    runs-on: ubuntu-latest
    needs: project-quality
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::spelling
            any::urlchecker
      - name: Spell check documentation
        run: |
          Rscript - <<'RSCRIPT'
          ignore <- character()
          if (file.exists('inst/WORDLIST')) {
            ignore <- readLines('inst/WORDLIST', warn = FALSE)
          }
          res <- spelling::spell_check_package(vignettes = TRUE, ignore = ignore)
          if (nrow(res) > 0) {
            print(res)
            stop('Spelling issues detected')
          }
          RSCRIPT
      - name: Validate documentation links
        run: |
          Rscript - <<'RSCRIPT'
          issues <- urlchecker::url_check()
          if (nrow(issues) > 0) {
            print(issues)
            stop('Invalid or unreachable URLs detected')
          }
          RSCRIPT

  benchmark-regression:
    name: Benchmark regression check
    runs-on: ubuntu-latest
    needs: project-quality
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
      - name: Install heteroTests and dependencies
        run: |
          Rscript -e "remotes::install_deps(dependencies = TRUE)"
          Rscript -e "remotes::install_local(upgrade = 'never')"
      - name: Run quick benchmark suite
        run: |
          Rscript - <<'RSCRIPT'
          suppressPackageStartupMessages(library(heteroTests))
          results <- run_benchmark_suite(
            sample_sizes = c(100L, 1000L, 10000L),
            replicates = c(3L, 2L, 1L),
            profile_memory = FALSE,
            progress = FALSE
          )
          report <- generate_benchmark_report(results, accuracy_tolerance = 5e-3)
          dir.create('inst/benchmarks/ci', recursive = TRUE, showWarnings = FALSE)
          utils::write.csv(report$speed, file = 'inst/benchmarks/ci/speed.csv', row.names = FALSE)
          utils::write.csv(report$accuracy, file = 'inst/benchmarks/ci/accuracy.csv', row.names = FALSE)

          speed <- subset(report$speed, package == 'heteroTests')
          baselines <- subset(report$speed, package != 'heteroTests')
          flagged <- FALSE
          if (nrow(baselines) > 0 && nrow(speed) > 0) {
            merged <- merge(speed, baselines, by = c('test', 'sample_size'), suffixes = c('_het', '_base'))
            merged$time_ratio <- merged$median_time_het / merged$median_time_base
            slow <- merged$time_ratio > 1.5
            if (any(slow, na.rm = TRUE)) {
              flagged <- TRUE
              print(merged[slow, c('test', 'sample_size', 'median_time_het', 'median_time_base', 'time_ratio')])
              message('heteroTests implementations slower than baselines by >50%')
            }
          }
          accuracy <- subset(report$accuracy, baseline_package %in% c('lmtest', 'car'))
          if (nrow(accuracy) > 0 && any(accuracy$median_p_value_diff > 0.05, na.rm = TRUE)) {
            flagged <- TRUE
            print(accuracy[accuracy$median_p_value_diff > 0.05, c('test', 'baseline_package', 'median_p_value_diff')])
            message('P-value divergence exceeds tolerance of 0.05')
          }
          if (flagged) {
            stop('Benchmark regression detected')
          }
          RSCRIPT
      - name: Upload benchmark artefacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: inst/benchmarks/ci
