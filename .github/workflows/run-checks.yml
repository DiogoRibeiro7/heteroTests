name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede a pull request's earlier runs, but never a push to main, keyed as
# in R-CMD-check.yml, which explains why the group holds the commit rather
# than the ref outside pull requests.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The full model-context matrix runs in one job, ubuntu-latest (R release) in
# R-CMD-check.yml; the coverage here runs the cells CRAN runs
# (tests/testthat/helper-model-context.R).
env:
  HETEROTESTS_FULL_MATRIX: 'false'

# The three jobs share no files, so they run in parallel.
# Each job stops at 45 minutes, the short ones too: on a slow Ubuntu mirror,
# installing R and the packages alone has taken 20 to 25 minutes, whatever the
# job runs after. A job still running at 45 is stuck, and is stopped, to be
# rerun, instead of holding the pull request.
jobs:
  project-quality:
    name: Style, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu-archive
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-r@v1
        with:
          r-version: 'release'
          use-public-rspm: "true"
      # roxygen2 is installed at the version of RoxygenNote, which man/ was
      # written with: a newer roxygen2 rewrites pages (the usage, the links)
      # with no change to R/, and would fail the check below by itself. To
      # move to a new roxygen2, regenerate man/ with it, which updates
      # RoxygenNote.
      - name: Read the roxygen2 version of RoxygenNote
        id: roxygen
        run: |
          echo "version=$(sed -n 's/^RoxygenNote: *//p' DESCRIPTION)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::styler
            any::lintr
            any::covr
            any::ggplot2
            roxygen2@${{ steps.roxygen.outputs.version }}
            spdep=?ignore
          needs: check
      # man/ is what roxygen2 writes from R/: a page edited by hand, or not
      # written again after its block changed, fails here. It runs in this
      # job because roxygen2 resolves a link to another package from the help
      # of that package, which must be installed, and before the project
      # checks because they restyle the code of R/, examples included.
      # roxygen2 leaves alone the pages without its "Generated by roxygen2"
      # line, and NAMESPACE, which are written by hand (see ROADMAP.md).
      # The step can also fail with no change to R/: a link to another
      # package names the help file the installed package documents the topic
      # in, as \link[quantreg:anova.rq], \link[ggplot2:scale_manual],
      # \link[ggplot2:theme], \link[lmtest:bptest], \link[lmtest:hmctest] and
      # the links to generics do, so a dependency that renames or moves a help file, or that fails
      # to install, changes the pages that link to it, as
      # [parallel::mclapply()] did between Linux and Windows until it was
      # written in Rd. Regenerate man/ then, and check the link.
      # `git status`, not `git diff`, so that a page roxygen2 adds or deletes
      # counts too.
      - name: Fail if man/ is not what roxygen2 writes from R/
        env:
          ROXYGEN_VERSION: ${{ steps.roxygen.outputs.version }}
        run: |
          Rscript - <<'RSCRIPT'
          installed <- as.character(utils::packageVersion("roxygen2"))
          if (installed != Sys.getenv("ROXYGEN_VERSION")) {
            stop("roxygen2 ", installed, " is installed, but RoxygenNote is ",
                 Sys.getenv("ROXYGEN_VERSION"), ".")
          }
          roxygen2::roxygenise()
          RSCRIPT
          changes="$(git status --porcelain -- man NAMESPACE)"
          if [ -n "$changes" ]; then
            echo "man/ is not what roxygen2 $ROXYGEN_VERSION writes from R/."
            echo "Run devtools::document() with roxygen2 $ROXYGEN_VERSION and commit the result:"
            echo "$changes"
            git diff -- man NAMESPACE
            exit 1
          fi
      - name: Run project checks
        run: Rscript scripts/run_checks.R
      - name: Upload coverage artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
      # Uploads the coverage scripts/run_checks.R computed and saved, rather
      # than running the suite a second time.
      - name: Upload to codecov
        if: success() || failure()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          Rscript -e "if (!requireNamespace('covr', quietly = TRUE)) install.packages('covr')"
          Rscript - <<'RSCRIPT'
          path <- file.path("coverage", "coverage.rds")
          if (!file.exists(path)) {
            stop("No ", path, ": scripts/run_checks.R stopped before it saved the coverage.")
          }
          covr::codecov(coverage = readRDS(path), token = Sys.getenv("CODECOV_TOKEN"))
          RSCRIPT

  docs-quality:
    name: Spell and link checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu-archive
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-r@v1
        with:
          r-version: 'release'
          use-public-rspm: "true"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::spelling
            any::urlchecker
            spdep=?ignore
      - name: Spell check documentation
        run: |
          Rscript - <<'RSCRIPT'
          # spell_check_package() has no `ignore` argument. Words to skip go in
          # inst/WORDLIST, which use_wordlist = TRUE reads automatically.
          res <- spelling::spell_check_package(vignettes = TRUE, use_wordlist = TRUE)
          if (nrow(res) > 0) {
            print(res)
            stop('Spelling issues detected. Add genuine terms to inst/WORDLIST.')
          }
          RSCRIPT
      # Reported, not gated. urlchecker::url_check() aborts on the first bad
      # URL, and the package's own documentation site is published only from main,
      # so a branch that has not merged yet can never satisfy it. External
      # reachability is also not a property of the commit -- sites go down and
      # rate-limit. Read the step output when changing documentation URLs.
      - name: Validate documentation links
        continue-on-error: true
        run: |
          Rscript - <<'RSCRIPT'
          urlchecker::url_check()
          RSCRIPT

  benchmark-regression:
    name: Benchmark regression check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu-archive
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-r@v1
        with:
          r-version: 'release'
          use-public-rspm: "true"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes, spdep=?ignore
      # setup-r-dependencies has installed every dependency but spdep.
      - name: Install heteroTests
        run: Rscript -e "remotes::install_local(upgrade = 'never')"
      - name: Run quick benchmark suite
        run: |
          Rscript - <<'RSCRIPT'
          suppressPackageStartupMessages(library(heteroTests))
          results <- run_benchmark_suite(
            sample_sizes = c(100L, 1000L, 10000L),
            replicates = c(3L, 2L, 1L),
            profile_memory = FALSE,
            progress = FALSE
          )
          report <- generate_benchmark_report(results, accuracy_tolerance = 5e-3)
          dir.create('inst/benchmarks/ci', recursive = TRUE, showWarnings = FALSE)
          utils::write.csv(report$speed, file = 'inst/benchmarks/ci/speed.csv', row.names = FALSE)
          utils::write.csv(report$accuracy, file = 'inst/benchmarks/ci/accuracy.csv', row.names = FALSE)

          speed <- subset(report$speed, package == 'heteroTests')
          baselines <- subset(report$speed, package != 'heteroTests')
          flagged <- FALSE
          # Informational only. heteroTests runs a validation layer that a bare
          # lmtest::bptest() call does not, so it is legitimately slower, and at
          # n = 100 the baseline time rounds to zero and the ratio is Inf. A
          # cross-package wall-clock comparison is not a regression test; the
          # table is uploaded as an artefact for inspection instead.
          if (nrow(baselines) > 0 && nrow(speed) > 0) {
            merged <- merge(speed, baselines, by = c('test', 'sample_size'), suffixes = c('_het', '_base'))
            merged$time_ratio <- merged$median_time_het / merged$median_time_base
            cat('Timing against baseline implementations:\n')
            print(merged[, c('test', 'sample_size', 'median_time_het', 'median_time_base', 'time_ratio')])
          }
          accuracy <- subset(report$accuracy, baseline_package %in% c('lmtest', 'car'))
          if (nrow(accuracy) > 0 && any(accuracy$median_p_value_diff > 0.05, na.rm = TRUE)) {
            flagged <- TRUE
            print(accuracy[accuracy$median_p_value_diff > 0.05, c('test', 'baseline_package', 'median_p_value_diff')])
            message('P-value divergence exceeds tolerance of 0.05')
          }
          if (flagged) {
            stop('Benchmark regression detected')
          }
          RSCRIPT
      - name: Upload benchmark artefacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: inst/benchmarks/ci
