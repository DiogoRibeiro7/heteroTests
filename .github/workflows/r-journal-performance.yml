name: R Journal performance

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Run the reduced benchmark grid"
        required: true
        default: false
        type: boolean

jobs:
  performance:
    name: Performance study
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-r@v1
        with:
          r-version: "release"
          use-public-rspm: "true"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::bench
            any::lmtest
            any::car
            any::ggplot2
          needs: check

      - name: Install package from source
        run: |
          Rscript -e "remotes::install_local(upgrade = 'never')"

      - name: Record R session
        run: |
          mkdir -p paper/generated
          Rscript -e "sessionInfo()" > paper/generated/performance-session-info.txt
          Rscript -e "cat(as.character(packageVersion('heteroTests')), '\n')" > paper/generated/performance-package-version.txt

      - name: Run performance study
        shell: bash
        run: |
          if [[ "${{ inputs.quick }}" == "true" ]]; then
            Rscript paper/performance_study.R --quick
          else
            Rscript paper/performance_study.R
          fi

      - name: Build manuscript performance outputs
        run: |
          Rscript paper/summarise_performance.R

      - name: Upload performance outputs
        uses: actions/upload-artifact@v4
        with:
          name: r-journal-performance-results
          path: paper/generated
          if-no-files-found: error
          retention-days: 30
