name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: '4.0'}
          - {os: ubuntu-latest, r: '4.1'}
          - {os: ubuntu-latest, r: '4.2'}
          - {os: ubuntu-latest, r: '4.3'}
          - {os: macos-latest, r: '4.3'}
          - {os: windows-latest, r: '4.3'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'

  cran-check:
    name: CRAN submission checks
    if: github.event_name != 'pull_request'
    needs: R-CMD-check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Run --as-cran checks
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--as-cran", "--run-dontrun")'

  revdep:
    name: Reverse dependency checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: R-CMD-check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::revdepcheck
          needs: check
      - name: Install package under test
        run: R CMD INSTALL .
      - name: Run reverse dependency checks
        run: |
          Rscript -e "revdepcheck::revdep_reset()"
          Rscript -e "revdepcheck::revdep_check(num_workers = 2, timeout = as.difftime(60, units = 'mins'))"
      - name: Upload revdep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revdep-results
          path: revdep
