name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Supersede a pull request's earlier runs, but never a push to main: those are
# the runs whose results are recorded against a merge.
#
# The group is keyed by commit rather than by ref for everything except pull
# requests. On main the ref is identical for push, schedule and
# workflow_dispatch, so a ref-keyed group would put all three in one queue --
# and because GitHub holds at most one pending run per group, a third arrival
# cancels the pending one. A merge landing while the weekly run sits in its
# hour-long cran-check would then wait behind it, and the merge after that
# would cancel it: exactly the lost result this block exists to prevent.
# Keying by SHA gives each commit its own group, so nothing queues or cancels.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'

  min-r-version:
    # Checks the DESCRIPTION contract, currently R (>= 4.1). That floor is set
    # by the hard dependencies -- ggplot2 and scales both require R >= 4.1, so
    # the package cannot install below it. Keep this job in step with Depends:.
    name: Minimum supported R (4.1)
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Hard dependencies only: several Suggests require newer R than the
          # declared floor, and would break resolution rather than reveal
          # anything about the package's own compatibility with its minimum.
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat
      - name: Check package (no vignettes; knitr is a Suggest)
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: false
          build_args: 'c("--no-build-vignettes")'
          args: 'c("--no-manual", "--no-vignettes", "--ignore-vignettes")'

  cran-check:
    name: CRAN submission checks
    # Not run on every merge. CRAN submission is not the near-term target, and
    # this job costs about an hour: it installs a LaTeX toolchain, every
    # `needs: check` dependency, and rebuilds the vignettes under --as-cran.
    # Three consecutive main runs were still queued or cancelled while it ran,
    # so it never completed anyway. It remains available on demand and on the
    # weekly schedule, which is enough to keep the signal that caught the
    # \doi{} note in 0.8.1.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: R-CMD-check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      # --as-cran builds the PDF manual, which needs a LaTeX toolchain. Without
      # this the job fails with 'pdflatex is not available', which reads as an Rd
      # problem but is purely a missing dependency.
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Run --as-cran checks
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--as-cran", "--run-dontrun")'

  revdep:
    name: Reverse dependency checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: R-CMD-check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::revdepcheck
          needs: check
      - name: Install package under test
        run: R CMD INSTALL .
      - name: Run reverse dependency checks
        run: |
          Rscript -e "revdepcheck::revdep_reset()"
          Rscript -e "revdepcheck::revdep_check(num_workers = 2, timeout = as.difftime(60, units = 'mins'))"
      - name: Upload revdep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revdep-results
          path: revdep
