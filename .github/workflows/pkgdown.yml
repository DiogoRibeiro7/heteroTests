name: pkgdown

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        # rsconnect is required because inst/tutorials makes pkgdown call
        # find_tutorials(). Note this list is a literal block scalar: a '#' line
        # inside it is a package ref, not a comment.
        with:
          extra-packages: |
            any::pkgdown
            any::rsconnect
            local::.
          needs: website
      # build_site_github_pages() only writes docs/. Without a deploy step the
      # job succeeded while the site was never published, which is why the URLs
      # in DESCRIPTION and inst/CITATION returned 404.
      - name: Build site
        run: |
          Rscript -e "pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)"

      # gh-pages carries nothing but pkgdown output, so a clean deploy is the
      # correct one: without it a page that is renamed or removed upstream
      # stays published forever. The action is pinned by commit rather than by
      # the floating v4 tag because this job holds contents: write.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.7.3
        with:
          clean: true
          branch: gh-pages
          folder: docs
