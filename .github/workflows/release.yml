name: Automated release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release work
        id: version
        shell: bash
        run: |
          version=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          cran_path="cran/heteroTests_${version}.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cran_path=$cran_path" >> "$GITHUB_OUTPUT"

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            previous=$(git show HEAD^:DESCRIPTION 2>/dev/null | grep '^Version:' | awk '{print $2}')
          else
            previous=""
          fi

          if [ "$version" != "$previous" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "$cran_path" ]; then
            echo "artifact_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing tag
        id: tag
        run: |
          version="${{ steps.version.outputs.version }}"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.version.outputs.version_changed == 'true' || steps.version.outputs.artifact_missing == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.version.outputs.version_changed == 'true' || steps.version.outputs.artifact_missing == 'true'
        with:
          use-public-rspm: true

      # R CMD build renders the vignettes, so the builder and everything the
      # vignettes use must be installed before creating the release tarball.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.version.outputs.version_changed == 'true' || steps.version.outputs.artifact_missing == 'true'
        with:
          extra-packages: any::knitr, any::rmarkdown
          needs: check

      - name: Build source package
        id: build
        if: steps.version.outputs.version_changed == 'true' || steps.version.outputs.artifact_missing == 'true'
        shell: bash
        run: |
          rm -f heteroTests_*.tar.gz
          R CMD build .
          tarball=$(ls -1t heteroTests_*.tar.gz | head -n 1)
          expected="heteroTests_${{ steps.version.outputs.version }}.tar.gz"
          if [ "$tarball" != "$expected" ]; then
            echo "Expected $expected but R CMD build produced $tarball" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version.outputs.version_changed == 'true' && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: heteroTests v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.tarball }}

      - name: Store CRAN source package in repository
        if: steps.version.outputs.artifact_missing == 'true'
        shell: bash
        run: |
          cran_path="${{ steps.version.outputs.cran_path }}"
          mkdir -p cran
          cp "${{ steps.build.outputs.tarball }}" "$cran_path"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$cran_path"
          git commit -m "chore: store CRAN source for v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
