name: Automated release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version bump
        id: version
        run: |
          current=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            previous=$(git show HEAD^:DESCRIPTION 2>/dev/null | grep '^Version:' | awk '{print $2}')
          else
            previous=""
          fi
          if [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for existing tag
        id: tag
        if: steps.version.outputs.changed == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: r-lib/actions/setup-r@v2
        if: steps.version.outputs.changed == 'true' && steps.tag.outputs.exists == 'false'
        with:
          use-public-rspm: true
      - name: Build source package
        id: build
        if: steps.version.outputs.changed == 'true' && steps.tag.outputs.exists == 'false'
        run: |
          rm -f *.tar.gz
          R CMD build .
          tarball=$(ls -1t *.tar.gz | head -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true' && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: heteroTests v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.tarball }}
