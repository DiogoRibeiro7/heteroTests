# Build the documentation site and deploy it to GitHub Pages.
#
# The API reference, its part of the nav in mkdocs.yml, and the releases and
# roadmap pages are generated from the Rd files, tools/reference-index.R,
# NEWS.md and ROADMAP.md by tools/build-docs.R, with the pages that redirect
# from the addresses of the pkgdown site, which also follow the vignettes; the
# build fails if the committed pages are out of date, and
# `mkdocs build --strict` fails on any broken link.
#
# The guide pages in docs/guide/ are rendered from the vignettes by
# tools/render-guides.R, which this workflow does not run, so the freshness
# check does not cover them: knitting runs the package and the packages the
# vignettes use, and the figures it draws differ in their bytes from one
# platform to another. They are committed as rendered.
#
# Pull requests build the site only. A push to main also deploys it, with the
# GitHub Actions Pages artifacts, which needs the repository's Pages source to
# be "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'man/**'
      - 'NEWS.md'
      - 'ROADMAP.md'
      - 'tools/**'
      - 'vignettes/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'man/**'
      - 'NEWS.md'
      - 'ROADMAP.md'
      - 'tools/**'
      - 'vignettes/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # It installs R: on a slow mirror that alone can take 25 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ubuntu-archive

      # tools/build-docs.R uses base R only, so the package's dependencies are
      # not installed.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Generate the reference, releases and roadmap pages
        run: Rscript tools/build-docs.R

      - name: Fail if the committed pages are out of date
        run: |
          changes="$(git status --porcelain -- docs mkdocs.yml)"
          if [ -n "$changes" ]; then
            echo "Run 'Rscript tools/build-docs.R' and commit the result:"
            echo "$changes"
            git diff -- docs mkdocs.yml
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build the site
        run: mkdocs build --strict

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
