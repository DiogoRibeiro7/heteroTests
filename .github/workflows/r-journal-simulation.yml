name: R Journal simulation

on:
  pull_request:
    branches: [main]
    paths:
      - "paper/simulation_study.R"
      - "paper/summarise_simulation.R"
      - "paper/heteroTests.Rmd"
      - ".github/workflows/r-journal-simulation.yml"
      - "R/**"
      - "DESCRIPTION"
  workflow_dispatch:

jobs:
  simulation:
    name: Monte Carlo study
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-r@v1
        with:
          r-version: "release"
          use-public-rspm: "true"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::ggplot2
            any::knitr
          needs: check

      - name: Install package from source
        run: |
          Rscript -e "remotes::install_local(upgrade = 'never')"

      - name: Record R session
        run: |
          mkdir -p paper/generated
          Rscript -e "sessionInfo()" > paper/generated/session-info.txt
          Rscript -e "cat(as.character(packageVersion('heteroTests')), '\n')" > paper/generated/package-version.txt

      - name: Run full simulation study
        run: |
          Rscript paper/simulation_study.R 2000

      - name: Build manuscript simulation outputs
        run: |
          Rscript paper/summarise_simulation.R

      - name: Upload simulation outputs
        uses: actions/upload-artifact@v4
        with:
          name: r-journal-simulation-results
          path: paper/generated
          if-no-files-found: error
          retention-days: 30
