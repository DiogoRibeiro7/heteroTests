template:
  bootstrap: 5
url: https://diogoribeiro7.github.io/heteroTests
destination: docs
navbar:
  title: heteroTests
  left:
    - text: "Reference"
      href: reference/index.html
    - text: "CRAN"
      href: https://CRAN.R-project.org/package=heteroTests
reference:
  - title: Tests of the variance
    desc: >
      Each test returns an `htest` object. The tests are grouped by the
      family they belong to.
  - subtitle: Auxiliary-regression tests
    contents:
      - performWhiteTest
      - performWhiteTestRobust
      - performWhiteTestStreaming
      - performBPTest
      - performBPTestRobust
      - performBPTestStreaming
      - performKoenkerTest
      - performKoenkerTestStreaming
      - performStudentizedBPTest
      - performCookWeisbergTest
      - performNCVTest
      - performHarveyTest
      - performGlejserTest
      - performParkTest
      - performVarianceFormTest
      - performDavidianCarrollTest
      - performSpearmanTest
      - performSpreadLevelTest
      - performHighDimensionalTest
  - subtitle: Tests on ordered observations
    contents:
      - performGQTest
      - performSzroeterTest
      - performHarrisonMcCabeTest
  - subtitle: Group-wise tests
    contents:
      - performLeveneTest
      - performBrownForsytheTest
      - performFlignerKilleenTest
      - performBartlettTest
      - performHartleyFmaxTest
      - performOBrienTest
      - performBoxMTest
  - subtitle: Time series, panel and spatial tests
    contents:
      - performArchLMTest
      - performMcLeodLiTest
      - performBPRandomEffectsTest
      - performPesaranTest
      - performSpatialHeteroTest
  - subtitle: Resampling and robust tests
    contents:
      - performWhiteTestBootstrap
      - performWildBootstrapTest
      - performRankPermutationTest
      - performQuantileRegressionTest
      - rbootstrap_test_statistic
      - bootstrap_methods
      - robust_implementations
      - modern_diagnostics
      - additional_tests
  - title: Model checks
    desc: >
      Checks of the fitted model that are not tests of the variance: the
      functional form, collinearity, influence and the fit itself. They are
      listed apart so that they are not mistaken for heteroscedasticity tests.
    contents:
      - performRESETTest
      - performVIFDiagnostic
      - performInfluenceDiagnostics
      - performScatterDiagnostic
      - checkModel
      - checkModelEnhanced
  - title: Running several diagnostics
    contents:
      - runHeteroTests
      - runHeteroTestsParallel
      - runDiagnostics
      - runDiagnosticPlots
      - runMultivariateTests
      - runTimeSeriesTests
      - runPanelTests
      - runSurveyHeteroTests
      - runAdvancedDiagnostics
      - compareModelDiagnostics
      - compareTestResults
      - analyzeMLResiduals
      - registerDiagnostic
      - registerPlot
      - listDiagnostics
      - HeteroDiagnostic
      - test.HeteroDiagnostic
      - summary.HeteroDiagnostic
      - plot.HeteroDiagnostic
      - hetero_test_suite
      - tidy.hetero_test
      - cachedTest
      - clearTestCache
      - clearAnalysisCache
      - TestFactory
      - test_factory
  - title: Remediation
    contents:
      - fitWLS
      - fitRobust
      - autoTransform
      - suggestRemediation
      - autoCompareRemediations
  - title: Recommendations
    contents:
      - generateHeteroRecommendations
  - title: Simulation
    desc: >
      The simulation functions are named in snake_case on purpose; the rest
      of the package uses camelCase.
    contents:
      - simulate_hetero
      - simulation_framework
      - plot.power_analysis
  - title: Plotting
    contents:
      - plotResidualsFitted
      - plotResidualsFittedEnhanced
      - plotSpreadLevel
      - plotResidualDensity
      - plotResidualQQ
      - plotBubbleVariance
      - plotDiagnosticSuite
      - plotDiagnosticSuiteEnhanced
      - plotBeforeAfter
      - autoplot.hetero_test_suite
      - theme_hetero
      - scale_colour_hetero_diagnostic
  - title: Reporting and data
    contents:
      - generateDiagnosticReport
      - downloadTeachingData
      - diagnostic_data
      - hetero_data
      - print.htest_enhanced
  - title: Dashboard and benchmarks
    desc: >
      To move to a companion package, once it has a name.
    contents:
      - launchDiagnosticDashboard
      - run_benchmark_suite
  - title: Package infrastructure
    contents:
      - ht_set_log_level
      - std_error
      - std_warning
      - validateTestInputs
      - checkData
      - rcalculateEffectSize
      - restimate_test_power
      - rvalidate_against_reference
  - title: Internal
    contents:
      - .diagnostic_registry
      - has_keyword("internal")
