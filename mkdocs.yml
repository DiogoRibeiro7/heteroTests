site_name: heteroTests
site_description: Heteroscedasticity diagnostics for linear models in R, with a consistent interface for classical, resampling and scalable tests, visualisation and remediation.
site_author: Diogo Ribeiro
site_url: https://diogoribeiro7.github.io/heteroTests/

repo_url: https://github.com/DiogoRibeiro7/heteroTests
repo_name: DiogoRibeiro7/heteroTests
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Diogo Ribeiro &mdash; Apache License 2.0

strict: true

exclude_docs: |
  requirements.txt

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png

  icon:
    repo: fontawesome/brands/github

  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

# The help pages and the guides write equations in LaTeX; arithmatex marks
# them and MathJax typesets them.
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

